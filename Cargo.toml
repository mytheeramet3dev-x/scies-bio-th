[package]
name = "scies-bio-th"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "A high-performance, dependency-free bioinformatics toolkit for Rust."
repository = "https://github.com/mytheeramet3dev-x/scies-bio-th"

[dependencies]
scies-math = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
parallel = []
interop = ["dep:scies-math"]
structure = []
network = []
stats = []
docking = ["structure"]
epigenome = []
regulatory = ["epigenome", "stats", "network"]
multiomics = ["regulatory", "stats"]
safety = ["stats"]
singlecell = ["stats", "network", "multiomics"]
pharma = ["stats"]
aging = ["docking", "epigenome", "safety", "regulatory", "singlecell", "pharma", "serde"]
imaging = []
experimental = []
full = [
  "structure",
  "network",
  "stats",
  "docking",
  "epigenome",
  "regulatory",
  "multiomics",
  "safety",
  "singlecell",
  "pharma",
  "aging",
  "imaging",
]

[[example]]
name = "design_from_real_genome"
required-features = ["aging"]

[[example]]
name = "design_immortal_genome"
required-features = ["aging"]

[dev-dependencies]
criterion = "0.5"
serde_json = "1.0"

[[bench]]
name = "align_bench"
harness = false
