[package]
name = "scies-bio-th"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "A high-performance, dependency-free bioinformatics toolkit for Rust."
repository = "https://github.com/mytheeramet3dev-x/scies-bio-th"

[dependencies]
scies-math = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
parallel = []
interop = ["dep:scies-math"]
structure = []
network = []
stats = []
docking = ["structure"]
epigenome = []
experimental = []
full = ["structure", "network", "stats", "docking", "epigenome", "experimental"]

[dev-dependencies]
criterion = "0.5"
serde_json = "1.0"

[[bench]]
name = "align_bench"
harness = false
